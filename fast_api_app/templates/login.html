<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Secure Login - Automation Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#05070c] text-gray-200 flex items-center justify-center h-screen">

    <div class="bg-[#0b132b] border border-gray-800 rounded-lg p-8 w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 tracking-wide">
                CRON AUTOMATION HUB
            </h1>
            <p class="text-xs text-gray-400 mt-2 uppercase tracking-widest">Noida-Mohali Secure Link</p>
        </div>

        <div id="error-box" class="hidden mb-4 p-3 bg-red-900/30 border border-red-800 rounded text-red-400 text-xs text-center">
            ❌ Invalid Username or Password! Access Denied.
        </div>

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 tracking-wider">👤 Username</label>
                <input type="text" name="username" required placeholder="e.g., mohit_manager" 
                       class="w-full bg-[#05070c] border border-gray-800 rounded px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-blue-500 transition placeholder-gray-700">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2 tracking-wider">🔑 Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full bg-[#05070c] border border-gray-800 rounded px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-blue-500 transition placeholder-gray-700">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded text-sm transition transform active:scale-95 shadow-lg">
                Verify & Enter Dashboard
            </button>
        </form>
    </div>

    <script>
        // URL se error check karne ka logic (agar /login?error=true aaya toh box dikhao)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('error-box').classList.remove('hidden');
        }
    </script>
</body>
</html>
